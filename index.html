<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tanishamiz PRO</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 10 px;
    background: #f4f4f4;
}

#login, #main, #chat, #profile, #admin {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    margin-top: 500px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

#main, #chat, #profile, #admin {
    display: none;
}

input {
    width: 90%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 10px;
}

button {
    width: 95%;
    padding: 12px;
    margin: 5px 0;
    background: #ff4d6d;
    color: white;
    border: none;
    border-radius: 10px;
}

.card {
    border: 1px solid #eee;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
}

#messages {
    height: 200px;
    overflow-y: auto;
    border: 1px solid #ddd;
    margin: 10px 0;
    padding: 10px;
    text-align: left;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
<h2>Tanishamiz</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Parol">
<input type="file" id="photo">
<button onclick="register()">Ro'yxatdan o'tish</button>
<button onclick="loginUser()">Kirish</button>
</div>

<!-- MAIN -->
<div id="main">
<h3>Foydalanuvchilar</h3>
<button onclick="openProfile()">Profilim</button>
<button onclick="openAdmin()">Admin</button>
<div id="users"></div>
</div>

<!-- PROFILE -->
<div id="profile">
<h3>Profil</h3>
<img id="myPhoto"><br>
<input id="bio" placeholder="Bio yozing">
<button onclick="saveProfile()">Saqlash</button>
<button onclick="back()">Orqaga</button>
</div>

<!-- ADMIN -->
<div id="admin">
<h3>Admin Panel</h3>
<div id="adminUsers"></div>
<button onclick="back()">Orqaga</button>
</div>

<!-- CHAT -->
<div id="chat">
<h3 id="chatTitle"></h3>
<div id="messages"></div>
<input id="msg" placeholder="Xabar yozing">
<button onclick="send()">Yuborish</button>
<button onclick="back()">Orqaga</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA-_NYrxTI6a6ThjPF2VQK_y7qrt99O0PY",
  authDomain: "tanishamiz.firebaseapp.com",
  databaseURL: "https://tanishamiz-default-rtdb.firebaseio.com",
  projectId: "tanishamiz",
  storageBucket: "tanishamiz.appspot.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

let currentChat = "";

/* REGISTER */
function register() {
    let file = photo.files[0];

    auth.createUserWithEmailAndPassword(email.value, password.value)
    .then(user => {
        let ref = storage.ref("profiles/" + user.user.uid);

        if(file){
            ref.put(file).then(() => {
                ref.getDownloadURL().then(url => saveUser(user, url));
            });
        } else {
            saveUser(user, "");
        }
    })
    .catch(e => alert(e.message));
}

function saveUser(user, photoUrl){
    db.ref("users/" + user.user.uid).set({
        email: email.value,
        photo: photoUrl,
        bio: "",
        role: "user",
        banned: false
    });
}

/* LOGIN */
function loginUser() {
    auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(e => alert(e.message));
}

/* STATE */
auth.onAuthStateChanged(user => {
    if (user) {
        db.ref("users/" + user.uid).once("value", snap => {
            let u = snap.val();

            if (u.banned) {
                alert("Siz bloklangansiz");
                auth.signOut();
                return;
            }

            login.style.display = "none";
            main.style.display = "block";
            loadUsers();
        });
    }
});

/* USERS */
function loadUsers() {
    db.ref("users").on("value", snap => {
        users.innerHTML = "";

        snap.forEach(child => {
            let u = child.val();
            let id = child.key;

            if (id !== auth.currentUser.uid) {
                let div = document.createElement("div");
                div.className = "card";

                div.innerHTML =
                "<img src='"+u.photo+"'>" +
                "<br>"+u.email+
                "<br>"+(u.bio || "")+
                "<br><button onclick='openChat(\""+id+"\",\""+u.email+"\")'>Chat</button>";

                users.appendChild(div);
            }
        });
    });
}

/* PROFILE */
function openProfile(){
    main.style.display="none";
    profile.style.display="block";

    db.ref("users/"+auth.currentUser.uid).once("value", snap=>{
        let u=snap.val();
        myPhoto.src=u.photo;
        bio.value=u.bio;
    });
}

function saveProfile(){
    db.ref("users/"+auth.currentUser.uid+"/bio").set(bio.value);
    alert("Saqlandi");
}

/* ADMIN */
function openAdmin(){
    db.ref("users/"+auth.currentUser.uid).once("value", snap=>{
        if(snap.val().role!="admin"){
            alert("Admin emassiz");
            return;
        }

        main.style.display="none";
        admin.style.display="block";

        loadAdminUsers();
    });
}

function loadAdminUsers(){
    db.ref("users").on("value", snap=>{
        adminUsers.innerHTML="";

        snap.forEach(child=>{
            let u=child.val();
            let id=child.key;

            let div=document.createElement("div");

            div.innerHTML=
            u.email+
            "<br><button onclick='banUser(\""+id+"\")'>Ban</button>";

            adminUsers.appendChild(div);
        });
    });
}

function banUser(id){
    db.ref("users/"+id+"/banned").set(true);
}

/* CHAT */
function openChat(id,name){
    currentChat = getChatId(auth.currentUser.uid,id);

    main.style.display="none";
    chat.style.display="block";
    chatTitle.innerText=name;

    loadMessages();
}

function getChatId(a,b){
    return a<b ? a+"_"+b : b+"_"+a;
}

function send(){
    if(msg.value=="") return;

    db.ref("messages/"+currentChat).push({
        user: auth.currentUser.email,
        text: msg.value
    });

    msg.value="";
}

function loadMessages(){
    messages.innerHTML="";

    db.ref("messages/"+currentChat).on("child_added", snap=>{
        let m=snap.val();
        messages.innerHTML+="<p><b>"+m.user+":</b> "+m.text+"</p>";
        messages.scrollTop = messages.scrollHeight;
    });
}

/* NAV */
function back(){
    profile.style.display="none";
    chat.style.display="none";
    admin.style.display="none";
    main.style.display="block";
}
</script>

</body>
</html>
